<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="100%" style="max-width:860px;height:auto;font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect width="860" height="330" rx="14" fill="#ffffff" stroke="#e3eaef"/><text x="34" y="32" font-size="15" fill="#0f1c26" text-anchor="start" font-weight="600" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" opacity="1.0">The numbers do not move when the simulation is refined</text><text x="34" y="52" font-size="12.5" fill="#5b7280" text-anchor="start" font-weight="400" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" opacity="1.0">the same two claims, recomputed at four higher resolutions</text><text x="470" y="92" font-size="12.5" fill="#ef8f1c" text-anchor="middle" font-weight="600" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" opacity="1.0">speed-up at De=0.3</text><text x="700" y="92" font-size="12.5" fill="#e6009e" text-anchor="middle" font-weight="600" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" opacity="1.0">at De=3.0</text><text x="40" y="126" font-size="13" fill="#5b7280" text-anchor="start" font-weight="400" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" opacity="1.0">reference</text><text x="470" y="126" font-size="14" fill="#0f1c26" text-anchor="middle" font-weight="500" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" opacity="1.0">1.4974×</text><text x="700" y="126" font-size="14" fill="#0f1c26" text-anchor="middle" font-weight="500" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" opacity="1.0">0.9137×</text><text x="40" y="156" font-size="13" fill="#5b7280" text-anchor="start" font-weight="400" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" opacity="1.0">4× finer in time</text><text x="470" y="1