ce,'SF Mono',Menlo,Consolas,monospace" opacity="1.0">0.9138×</text><line x1="34" y1="262" x2="826" y2="262" stroke="#e3eaef"/><text x="40" y="284" font-size="13" fill="#0f1c26" text-anchor="start" font-weight="600" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" opacity="1.0">total spread</text><text x="470" y="284" font-size="14" fill="#ef8f1c" text-anchor="middle" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" opacity="1.0">0.41%</text><text x="700" y="284" font-size="14" fill="#e6009e" text-anchor="middle" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" opacity="1.0">0.02%</text><text x="40" y="314" font-size="12.5" fill="#12a594" text-anchor="start" font-weight="400" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" opacity="1.0">In water, every one of these strokes returns exactly 0.000 — the swimmer really is a scallop.</text></svg>