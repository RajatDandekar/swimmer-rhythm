  <text x="307.5" y="209.0" font-size="10" fill="#6d665a" text-anchor="middle"
        font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">rhythm ρ(t)</text><path d="M 557 198.0 L 628 198.0" fill="none" stroke="#d06a1c" stroke-width="2" marker-end="url(#ah-d06a1c)"/>
  <text x="592.5" y="187.0" font-size="12" fill="#d06a1c" text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="600">outcome</text>
  <text x="592.5" y="209.0" font-size="10" fill="#6d665a" text-anchor="middle"
        font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Δx / stroke</text><path d="M735 246 L735 316 L165 316 L165 246" fill="none" stroke="#b3006b" stroke-width="2" marker-end="url(#ah-b3006b)"/><rect x="360" y="294" width="180" height="44" rx="10" fill="#f6f4ec" stroke="#e7e2d5"/><text x="450" y="313" font-size="13" fill="#b3006b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="600">policy-gradient update</text><text x="450" y="330" font-size="10.5" fill="#6d665a" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">nudge π toward higher reward</text><rect x="60" y="362" width="780" height="42" rx="10" fill="#ffffff" stroke="#1c7a55" stroke-opacity="0.5"/><text x="80" y="388" font-size="12.5" fill="#6d665a" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">reward &#160;=&#160;</text><text x="150" y="388" font-size="14" fill="#16130d" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-weight="700">net displacement per stroke</text><text x="440" y="388" font-size="12.5" fill="#6d665a" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">&#160;&#160;at a fixed energy budget &#160;(so it cannot cheat by pushing harder)</text></svg>