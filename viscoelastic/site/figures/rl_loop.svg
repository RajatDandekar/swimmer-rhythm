<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" style="max-width:900px;height:auto"><defs><marker id="ah-1a6fb0" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#1a6fb0"/></marker><marker id="ah-d06a1c" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#d06a1c"/></marker><marker id="ah-b3006b" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#b3006b"/></marker></defs><rect width="900" height="430" rx="14" fill="#ffffff" stroke="#e7e2d5"/><text x="34" y="40" font-size="19" fill="#16130d" font-family="Fraunces,Georgia,serif" font-weight="600">How the agent learns to swim</text><text x="34" y="63" font-size="13" fill="#6d665a" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">a policy trained by REINFORCE — no equations, no target stroke, only a scalar reward</text>
  <rect x="60" y="150" width="210" height="96" rx="12" fill="#ffffff" stroke="#e7e2d5"/>
  <rect x="60" y="150" width="5" height="96" rx="2.5" fill="#1a6fb0"/>
  <text x="165.0" y="177" font-size="15.5" fill="#16130d" text-anchor="middle"
        font-family="Fraunces,Georgia,serif" font-weight="600">Agent</text>
  <text x="165.0" y="198" font-size="12" fill="#6d665a" text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">policy network π(a | s)</text>
  <rect x="345" y="150" width="210" height="96" rx="12" fill="#ffffff" stroke="#e7e2d5"/>
  <rect x="345" y="150" width="5" height="96" rx="2.5" fill="#d06a1c"/>
  <text x="450.0" y="177" font-size="15.5" fill="#16130d" text-anchor="middle"
        font-family="Fraunces,Georgia,serif" font-weight="600">Environment</text>
  <text x="450.0" y="198" font-size="12" fill="#6d665a" text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">viscoelastic fluid solver</text>
  <rect x="630" y="150" width="210" height="96" rx="12" fill="#ffffff" stroke="#e7e2d5"/>
  <rect x="630" y="150" width="5" height="96" rx="2.5" fill="#1c7a55"/>
  <text x="735.0" y="177" font-size="15.5" fill="#16130d" text-anchor="middle"
        font-family="Fraunces,Georgia,serif" font-weight="600">Reward</text>
  <text x="735.0" y="198" font-size="12" fill="#6d665a" text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">how far it swam</text><path d="M 272 198.0 L 343 198.0" fill="none" stroke="#1a6fb0" stroke-width="2" marker-end="url(#ah-1a6fb0)"/>
  <text x="307.5" y="187.0" font-size="12" fill="#1a6fb0" text-anchor="middle"
